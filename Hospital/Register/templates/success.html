<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointment Success</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">Appointment Confirmed</h4>
                </div>

                <div class="card-body">

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Name</div>
                        <div class="col-7">: {{ name }}</div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Age</div>
                        <div class="col-7">: {{ age }}</div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Concerns</div>
                        <div class="col-7">: {{ concerns }}</div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Doctor Name</div>
                        <div class="col-7">: {{ doctor_name }}</div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Date</div>
                        <div class="col-7">: {{ date }}</div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-5 fw-bold">Time</div>
                        <div class="col-7">: {{ time }}</div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
